name: sentinel
version: 2.0.2
description: |
  CMG system-level enforcement plugin. Hard-enforces rules at multiple layers:
  - pre_tool_call: blocks skill-file writes + protected paths (write-aware; v2.0.2 契约修复 {"action":"block"})
  - pre_llm_call: step-completeness check + sentinel + blacklist + behavior detectors
  - post_llm_call: detect & record only (v0.21+ core consumes no return; blocks ride transform_llm_output)
  - transform_llm_output: ban keyword replacement in AI output
  - v2.0.0: behavior-level detectors (gap/lazy/meta) — inject / toolseq / output / path_write
  - 13 additional configurable hooks for advanced enforcement
author: L1veSong
license: MIT
provides_hooks:
  # Core (default ON)
  - pre_tool_call
  - pre_llm_call
  - post_llm_call
  - transform_llm_output
  # Tool layer (configurable)
  - post_tool_call
  - transform_tool_result
  - transform_terminal_output
  # LLM layer (configurable)
  - pre_api_request
  - post_api_request
  # Session layer (configurable)
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  # Gateway/platform layer (configurable)
  - pre_gateway_dispatch
  - pre_approval_request
  - post_approval_response
  # Sub-agent layer (configurable)
  - subagent_stop
kind: standalone
homepage: https://github.com/L1veSong/CMG
